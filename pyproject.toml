[project]
name = "podgen"
version = "1.0.0"
description = "Local NotebookLM-style podcast generator: documents -> two-speaker transcript -> audio"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "pypdf>=5.0.0",
    "kokoro>=0.9.2",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "numpy>=1.26",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
podgen = "podgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podgen"]
